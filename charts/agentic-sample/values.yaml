---
dataconsumerOne:
  enabled: true
  seedTestdata: false
  nameOverride: dataconsumer-1
  secrets:
    edc-wallet-secret: changeme
  dataspace-connector-bundle:
    tractusx-connector:
      nameOverride: dataconsumer-1-edc
      participant:
        id: BPNL00000003AZQP
        # Participant Context Id - Required since tractusx-edc 0.12.0 (multi-tenancy)
        contextId: "00000000-0000-0000-0000-000000000001"
      iatp:
        id: did:web:ssi-dim-wallet-stub.tx.test:BPNL00000003AZQP
        trustedIssuers:
          - did:web:ssi-dim-wallet-stub.tx.test:BPNL00000003CRHK
        sts:
          dim:
            url: http://ssi-dim-wallet-stub.tx.test/api/sts
          oauth:
            token_url: http://ssi-dim-wallet-stub.tx.test/oauth/token
            client:
              id: BPNL00000003AZQP
              secret_alias: edc-wallet-secret
      controlplane:
        env:
          TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-stub.tx.test/api
          EDC_IAM_DID_WEB_USE_HTTPS: false
        bdrs:
          server:
            url: http://ssi-dim-wallet-stub.tx.test/api/v1/directory
        endpoints:
          management:
            authKey: TEST1
        ingresses:
          - enabled: true
            hostname: "dataconsumer-1-controlplane.tx.test"
            endpoints:
              - default
              - protocol
              - management
            className: "nginx"
            tls:
              enabled: false
      dataplane:
        env:
          TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-stub.tx.test/api
          EDC_IAM_DID_WEB_USE_HTTPS: false
        ingresses:
          - enabled: true
            hostname: "dataconsumer-1-dataplane.tx.test"
            endpoints:
              - default
              - public
            className: "nginx"
            tls:
              enabled: false
        token:
          signer:
            privatekey_alias: tokenSignerPrivateKey
          verifier:
            publickey_alias: tokenSignerPublicKey
      postgresql:
        jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-dataconsumer-1-db:5432/edc"
        auth:
          password: "dbpassworddataconsumerone"
          postgresPassword: "dbpassworddataconsumerone"
      vault:
        hashicorp:
          url: http://{{ .Release.Name }}-edc-dataconsumer-1-vault:8200

    postgresql:
      nameOverride: dataconsumer-1-db
      auth:
        password: "dbpassworddataconsumerone"
        postgresPassword: "dbpassworddataconsumerone"

    vault:
      nameOverride: edc-dataconsumer-1-vault
      enabled: true

  data-persistence-layer-bundle:
    enabled: false

  digital-twin-bundle:
    enabled: false

tx-data-provider:
  enabled: true
  seedTestdata: false
  backendUrl: http://{{ .Release.Name }}-dataprovider-submodelserver:8080
  registryUrl: http://{{ .Release.Name }}-dataprovider-dtr:8080/api/v3
  controlplanePublicUrl: http://{{ .Release.Name }}-dataprovider-edc-controlplane:8084
  controlplaneManagementUrl: http://{{ .Release.Name }}-dataprovider-edc-controlplane:8081
  dataplaneUrl: http://{{ .Release.Name }}-dataprovider-edc-dataplane:8081
  nameOverride: dataprovider
  secrets:
    edc-wallet-secret: changeme
  dataspace-connector-bundle:
    tractusx-connector:
      nameOverride: dataprovider-edc
      participant:
        id: BPNL00000003AYRE
        # Participant Context Id - Required since tractusx-edc 0.12.0 (multi-tenancy)
        contextId: "00000000-0000-0000-0000-000000000002"
      iatp:
        id: did:web:ssi-dim-wallet-stub.tx.test:BPNL00000003AYRE
        trustedIssuers:
          - did:web:ssi-dim-wallet-stub.tx.test:BPNL00000003CRHK
        sts:
          dim:
            url: http://ssi-dim-wallet-stub.tx.test/api/sts
          oauth:
            token_url: http://ssi-dim-wallet-stub.tx.test/oauth/token
            client:
              id: BPNL00000003AYRE
              secret_alias: edc-wallet-secret
      controlplane:
        env:
          TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-stub.tx.test/api
          EDC_IAM_DID_WEB_USE_HTTPS: false
        bdrs:
          server:
            url: http://ssi-dim-wallet-stub.tx.test/api/v1/directory
        endpoints:
          management:
            authKey: TEST2
        ingresses:
          - enabled: true
            hostname: "dataprovider-controlplane.tx.test"
            endpoints:
              - default
              - protocol
              - management
            className: "nginx"
            tls:
              enabled: false
      dataplane:
        env:
          TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: http://ssi-dim-wallet-stub.tx.test/api
          EDC_IAM_DID_WEB_USE_HTTPS: false
        ingresses:
          - enabled: true
            hostname: "dataprovider-dataplane.tx.test"
            endpoints:
              - default
              - public
            className: "nginx"
            tls:
              enabled: false
        token:
          signer:
            privatekey_alias: tokenSignerPrivateKey
          verifier:
            publickey_alias: tokenSignerPublicKey
      postgresql:
        jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-dataprovider-db:5432/edc"
        auth:
          user: "dbusertxdataprovider"
          password: "dbpasswordtxdataprovider"
          postgresPassword: "dbpasswordtxdataprovider"
      vault:
        hashicorp:
          url: http://{{ .Release.Name }}-edc-dataprovider-vault:8200

    postgresql:
      nameOverride: dataprovider-db
      auth:
        user: "dbusertxdataprovider"
        password: "dbpasswordtxdataprovider"
        postgresPassword: "dbpasswordtxdataprovider"

    vault:
      nameOverride: edc-dataprovider-vault
      enabled: true

pgadmin4:
  enabled: true
  env:
    email: pgadmin4@txtest.org
    password: tractusxpgadmin4
  persistentVolume:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - host: pgadmin4.tx.test
        paths:
          - path: /
            pathType: Prefix

identity-and-trust-bundle:
  enabled: true
  ssi-dim-wallet-stub:
    wallet:
      replicaCount: 1
      host: ssi-dim-wallet-stub.tx.test
      nameSpace: "umbrella"
      appName: "ssi-dim-wallet-stub"
      configName: "ssi-dim-wallet-config"
      serviceName: "ssi-dim-wallet-service"
      secretName: "ssi-dim-wallet-secret"
      ingressName: "ssi-dim-wallet-ingress"
      seeding:
        bpnList: "BPNL00000003AZQP,BPNL00000003AYRE"
      ingress:
        enabled: true
        tls:
          enabled: false
          name: ""
        urlPrefix: /
        className: nginx
        annotations: {}
      swagger:
        ui:
          status: true
        apiDoc:
          status: true
      logLevel: "debug"
      environment: "default"
      baseWalletBpn: "BPNL00000003CRHK"
      didHost: "ssi-dim-wallet-stub.tx.test"
      stubUrl: "http://ssi-dim-wallet-stub.tx.test"
      statusListVcId: "8a6c7486-1e1f-4555-bdd2-1a178182651e"
      tokenExpiryTime: "5"
      portal:
        waitTime: "60"
        host: "http://portal-backend.tx.test"
        clientId: "sa-cl2-05"
        clientSecret: "changeme"
      keycloak:
        realm: "CX-Central"
        authServerUrl: "http://centralidp.tx.test/auth"
      postgresql:
        username: "postgres"
        password: "postgrespassword"
      service:
        type: ClusterIP
        port: 8080
      resources:
        requests:
          # -- CPU resource requests
          cpu: 500m
          # -- Memory resource requests
          memory: 1Gi
        limits:
          # -- CPU resource limits
          cpu: 1
          # -- Memory resource limits
          memory: 2Gi
  postgresql:
    fullnameOverride: wallet-postgres
    enabled: true
    configmap:
      name: wallet-postgres-configmap
    auth:
      username: postgres
      password: postgrespassword
    persistence:
      enabled: false
      size: 10Gi
      storageClass: standard
